name: Run Earthquake PH weekly

on:
  schedule:
    - cron: '45 13 * * 4'  # 13:45 UTC every Thursday
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Practical/Projects/PH Earthquakes/requirements.txt"

      - name: Run Earthquake PH scraper
        run: python "Practical/Projects/PH Earthquakes/earthquake_ph.py"
